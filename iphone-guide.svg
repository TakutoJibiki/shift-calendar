<svg viewBox="0 0 1020 660" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect x="0" y="0" width="1020" height="660" fill="#f4f4f2"/>
  <text x="510" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#23262b">iPhoneでの操作イメージ(実機のスクリーンショットを元にした挿絵です)</text>

  <!-- ===== STEP 1: ツールで保存する ===== -->
  <g transform="translate(20,50)">
    <rect x="0" y="0" width="260" height="540" rx="38" fill="#000000"/>
    <rect x="8" y="8" width="244" height="524" rx="28" fill="#111318"/>
    <rect x="95" y="16" width="70" height="13" rx="6.5" fill="#000000"/>

    <text x="24" y="52" font-size="11.5" font-weight="700" fill="#ffffff">2026年 10月</text>
    <text x="222" y="52" font-size="11" fill="#8a8f98">‹ ›</text>
    <line x1="16" y1="62" x2="244" y2="62" stroke="#2c2f36"/>

    <g font-size="9" font-weight="700" fill="#9a9a9e" text-anchor="middle">
      <text x="34" y="78" fill="#e0897f">日</text><text x="68" y="78">月</text><text x="102" y="78">火</text>
      <text x="136" y="78">水</text><text x="170" y="78">木</text><text x="204" y="78">金</text><text x="230" y="78" fill="#7fa2e8">土</text>
    </g>

    <g font-size="9" text-anchor="middle">
      <rect x="18" y="86" width="30" height="30" rx="5" fill="#20232a"/><text x="33" y="98" fill="#7a7f88">2</text>
      <rect x="52" y="86" width="30" height="30" rx="5" fill="#20232a"/><text x="67" y="98" fill="#7a7f88">3</text>
      <rect x="86" y="86" width="30" height="30" rx="5" fill="#3a2e12" stroke="#c1791f"/><text x="101" y="97" fill="#fff" font-weight="700">4</text><text x="101" y="108" fill="#f0c14b" font-size="8">遅</text>
      <rect x="120" y="86" width="30" height="30" rx="5" fill="#38223a" stroke="#8a3f78"/><text x="135" y="97" fill="#fff" font-weight="700">5</text><text x="135" y="108" fill="#d79bd0" font-size="8">入り</text>
      <rect x="154" y="86" width="30" height="30" rx="5" fill="#26282c" stroke="#6b7280"/><text x="169" y="97" fill="#fff" font-weight="700">6</text><text x="169" y="108" fill="#b7bcc4" font-size="8">明け</text>
      <rect x="188" y="86" width="30" height="30" rx="5" fill="#173323" stroke="#2f8f5b"/><text x="203" y="97" fill="#fff" font-weight="700">7</text><text x="203" y="108" fill="#8fd6ac" font-size="8">休み</text>
      <rect x="222" y="86" width="18" height="30" rx="5" fill="#20232a"/><text x="231" y="98" fill="#7a7f88">8</text>
    </g>

    <line x1="16" y1="128" x2="244" y2="128" stroke="#2c2f36"/>
    <text x="24" y="146" font-size="10.5" font-weight="700" fill="#ffffff">今月の内訳</text>
    <rect x="24" y="154" width="52" height="20" rx="10" fill="#20232a"/><text x="50" y="167" font-size="8.5" text-anchor="middle" fill="#c7c7cc">遅 1日</text>
    <rect x="80" y="154" width="58" height="20" rx="10" fill="#20232a"/><text x="109" y="167" font-size="8.5" text-anchor="middle" fill="#c7c7cc">休み 1日</text>
    <rect x="142" y="154" width="58" height="20" rx="10" fill="#20232a"/><text x="171" y="167" font-size="8.5" text-anchor="middle" fill="#c7c7cc">入り 1日</text>

    <line x1="16" y1="186" x2="244" y2="186" stroke="#2c2f36"/>
    <text x="24" y="204" font-size="11" font-weight="700" fill="#ffffff">Googleカレンダーに追加する</text>
    <rect x="24" y="214" width="220" height="40" rx="10" fill="#7c98d6"/>
    <text x="134" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#10131a">① 予定ファイルを保存する</text>
    <circle cx="134" cy="234" r="26" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="3 4"/>

    <rect x="24" y="450" width="212" height="70" rx="12" fill="#332907" stroke="#6b5518"/>
    <text x="130" y="475" text-anchor="middle" font-size="11" font-weight="700" fill="#f0c14b">STEP 1</text>
    <text x="130" y="493" text-anchor="middle" font-size="10.5" font-weight="700" fill="#f0c14b">カレンダーでシフトを選び</text>
    <text x="130" y="509" text-anchor="middle" font-size="10.5" font-weight="700" fill="#f0c14b">「保存する」を押す</text>
  </g>
  <text x="150" y="616" text-anchor="middle" font-size="13.5" font-weight="700" fill="#23262b">STEP 1 ツールで保存</text>

  <!-- ===== STEP 2: 予定を確認して追加 ===== -->
  <g transform="translate(380,50)">
    <rect x="0" y="0" width="260" height="540" rx="38" fill="#000000"/>
    <rect x="8" y="8" width="244" height="524" rx="28" fill="#1c1c1e"/>
    <rect x="95" y="16" width="70" height="13" rx="6.5" fill="#000000"/>

    <circle cx="28" cy="46" r="12" fill="#0a84ff"/>
    <path d="M23 46 l3 4 l7 -8" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="130" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2件の予定</text>
    <rect x="198" y="36" width="56" height="24" rx="12" fill="#0a84ff"/>
    <text x="226" y="52" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">追加(2)</text>
    <line x1="8" y1="68" x2="252" y2="68" stroke="#3a3a3c"/>

    <text x="24" y="88" font-size="10.5" fill="#9a9a9e">10月4日 日曜日</text>
    <rect x="24" y="96" width="220" height="34" rx="8" fill="#2c2c2e"/>
    <circle cx="38" cy="113" r="8" fill="#0a84ff"/>
    <path d="M34.5 113 l2.3 2.6 l4.2 -5.2" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="52" y="105" width="3" height="16" fill="#c1791f"/>
    <text x="62" y="117" font-size="12.5" font-weight="700" fill="#ffffff">遅</text>
    <text x="238" y="111" text-anchor="end" font-size="10.5" fill="#c7c7cc">10:00</text>
    <text x="238" y="124" text-anchor="end" font-size="10.5" fill="#9a9a9e">19:00</text>

    <text x="24" y="148" font-size="10.5" fill="#9a9a9e">10月7日 水曜日</text>
    <rect x="24" y="156" width="220" height="34" rx="8" fill="#2c2c2e"/>
    <circle cx="38" cy="173" r="8" fill="#0a84ff"/>
    <path d="M34.5 173 l2.3 2.6 l4.2 -5.2" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="52" y="165" width="3" height="16" fill="#2f8f5b"/>
    <text x="62" y="177" font-size="12.5" font-weight="700" fill="#ffffff">休み</text>
    <text x="238" y="177" text-anchor="end" font-size="10.5" fill="#9a9a9e">終日</text>

    <text x="130" y="216" text-anchor="middle" font-size="9" fill="#7a7a7e">チェックを外すとその予定だけ除外できます</text>

    <rect x="24" y="450" width="212" height="70" rx="12" fill="#332907" stroke="#6b5518"/>
    <text x="130" y="475" text-anchor="middle" font-size="11" font-weight="700" fill="#f0c14b">STEP 2</text>
    <text x="130" y="493" text-anchor="middle" font-size="10.5" font-weight="700" fill="#f0c14b">内容を確認して</text>
    <text x="130" y="509" text-anchor="middle" font-size="10.5" font-weight="700" fill="#f0c14b">「追加」をタップ</text>
  </g>
  <text x="510" y="616" text-anchor="middle" font-size="13.5" font-weight="700" fill="#23262b">STEP 2 予定を確認</text>

  <!-- ===== STEP 3: カレンダーを選ぶ ===== -->
  <g transform="translate(740,50)">
    <rect x="0" y="0" width="260" height="540" rx="38" fill="#000000"/>
    <rect x="8" y="8" width="244" height="524" rx="28" fill="#1c1c1e"/>
    <rect x="95" y="16" width="70" height="13" rx="6.5" fill="#000000"/>

    <circle cx="26" cy="46" r="11" fill="#3a3a3c"/>
    <text x="26" y="50" text-anchor="middle" font-size="11" fill="#c7c7cc">×</text>
    <text x="130" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">カレンダー</text>
    <circle cx="234" cy="46" r="12" fill="#0a84ff"/>
    <path d="M228 46 l3 4 l7 -8" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="8" y1="66" x2="252" y2="66" stroke="#3a3a3c"/>

    <text x="24" y="84" font-size="11" font-weight="700" fill="#9a9a9e">GMAIL</text>
    <rect x="16" y="92" width="228" height="34" rx="10" fill="#123354" stroke="#0a84ff"/>
    <circle cx="34" cy="109" r="6" fill="#4f86c6"/>
    <rect x="48" y="102" width="70" height="13" rx="3" fill="#48484a"/>
    <text x="122" y="113" font-size="12" fill="#ffffff">@gmail.com</text>
    <circle cx="234" cy="109" r="9" fill="#0a84ff"/>
    <path d="M230 109 l1.8 2 l4.2 -4.6" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="24" y="150" font-size="11" font-weight="700" fill="#9a9a9e">ICLOUD</text>
    <rect x="16" y="158" width="228" height="34" rx="10" fill="#2c2c2e"/>
    <circle cx="34" cy="175" r="6" fill="#8a3f78"/>
    <text x="48" y="179" font-size="12" fill="#c7c7cc">個人</text>
    <rect x="16" y="196" width="228" height="34" rx="10" fill="#2c2c2e"/>
    <circle cx="34" cy="213" r="6" fill="#2f7a52"/>
    <text x="48" y="217" font-size="12" fill="#c7c7cc">仕事</text>

    <path d="M170 266 q40 -60 40 -130" fill="none" stroke="#ff6961" stroke-width="1.8"/>
    <path d="M212 138 l-9 -4 l7 -8 z" fill="#ff6961"/>
    <text x="130" y="286" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ff6961">「Gmail」内の、自分の</text>
    <text x="130" y="301" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ff6961">@gmail.comのカレンダーを選ぶ</text>

    <rect x="24" y="450" width="212" height="70" rx="12" fill="#332907" stroke="#6b5518"/>
    <text x="130" y="475" text-anchor="middle" font-size="11" font-weight="700" fill="#f0c14b">STEP 3</text>
    <text x="130" y="493" text-anchor="middle" font-size="10.5" font-weight="700" fill="#f0c14b">Gmailのカレンダーを選び</text>
    <text x="130" y="509" text-anchor="middle" font-size="10.5" font-weight="700" fill="#f0c14b">右上の✓をタップ</text>
  </g>
  <text x="870" y="616" text-anchor="middle" font-size="13.5" font-weight="700" fill="#23262b">STEP 3 カレンダーを選ぶ</text>

  <text x="510" y="642" text-anchor="middle" font-size="11.5" fill="#6b6f76">※STEP3で「Gmail」が表示されない場合は、先に設定▷カレンダー▷アカウント▷アカウントを追加からGoogleアカウントを追加してください</text>
</svg>
